<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wallace McCarthy</title>
<meta name="description" content="Small tools that each do one thing well.">
<link rel="icon" href="icons/notchmic.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* 60/30/10: calm white main, soft grey second, one cobalt accent for action, focus and the live header */
:root {
  --bg: #FFFFFF;
  --surface: #F4F4F5;
  --line: #E4E4E7;
  --ink: #000000;
  --soft: #6B6B73;
  --accent: #2340D9;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --font: "Geist", system-ui, -apple-system, sans-serif;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 400 1rem/1.6 var(--font);
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 8px; }

.page { max-width: 680px; margin: 0 auto; padding: clamp(20px, 5vw, 48px) clamp(16px, 4vw, 24px) 64px; }

/* Full-page WebGPU contour map that reacts to the pointer; plain white without WebGPU */
#terrain {
  position: fixed; inset: 0;
  width: 100vw; height: 100vh;
  z-index: -1;
  opacity: 0;
  transition: opacity .8s var(--ease-out);
  pointer-events: none;
}
#terrain.on { opacity: 1; }
.hero { padding-top: clamp(72px, 16vh, 160px); }
.hero h1 {
  margin: 0;
  font-size: clamp(2.4rem, 7vw, 3.6rem);
  font-weight: 600;
  letter-spacing: -0.035em;
  line-height: 1.05;
}
.intro { margin: 24px 0 0; font-size: 1.125rem; color: var(--soft); max-width: 52ch; }
.intro a { color: var(--ink); text-underline-offset: 3px; text-decoration-color: var(--line); transition: text-decoration-color .15s; }
.intro a:hover { text-decoration-color: var(--ink); }

h2 { margin: 48px 0 8px; font-size: .95rem; font-weight: 500; color: var(--soft); }
h2 span { color: var(--ink); }

.projects { list-style: none; margin: 0 -12px; padding: 0; }
.project {
  position: relative;
  display: grid;
  grid-template-columns: 52px minmax(0, 1fr);
  grid-template-areas: "icon title" "icon blurb" "icon links";
  column-gap: 16px;
  padding: 14px 12px;
  border-radius: 14px;
  transition: background-color .15s var(--ease-out), transform .15s var(--ease-out);
}
.project:hover { background: rgba(244, 244, 245, .82); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.project:active { transform: scale(0.99); }
.icon {
  grid-area: icon;
  width: 52px; height: 52px;
  border-radius: 12px;
  object-fit: cover;
  display: grid; place-items: center;
  font-weight: 600; font-size: 1.4rem; color: #fff;
  background: var(--accent);
  box-shadow: 0 0 0 1px rgba(0,0,0,.06);
}
.project h3 { grid-area: title; margin: 2px 0 0; font-size: 1.05rem; font-weight: 600; letter-spacing: -0.01em; }
.project h3 a { text-decoration: none; }
/* Fitts: the whole row opens the project, not just the title */
.project h3 a::after { content: ""; position: absolute; inset: 0; border-radius: 14px; }
.year { font-weight: 400; color: var(--soft); margin-left: 6px; font-size: .9rem; }
.project p { grid-area: blurb; margin: 2px 0 0; color: var(--soft); font-size: .95rem; }
.tags { color: var(--ink); }
.links { grid-area: links; display: flex; gap: 8px; margin-top: 10px; }
.links a {
  position: relative; z-index: 1;   /* above the row-wide link */
  text-decoration: none;
  font-size: .875rem; font-weight: 500;
  height: 32px; padding: 0 14px;
  display: inline-flex; align-items: center;
  border-radius: 8px;
  background: var(--bg);
  box-shadow: inset 0 0 0 1px var(--line);
  transition: transform .12s var(--ease-out), background-color .15s, box-shadow .15s;
}
.links a:hover { box-shadow: inset 0 0 0 1px #C9C9CF; }
.links a.primary { background: var(--ink); color: #fff; box-shadow: none; }
.links a.primary:hover { background: var(--accent); }
.links a:active { transform: scale(0.97); }

footer { margin-top: 56px; padding-top: 20px; border-top: 1px solid var(--line); color: var(--soft); font-size: .875rem; }

/* One orchestrated entrance: content settles in from 93% scale and a 2px blur */
.enter { animation: enter .42s var(--ease-out) both; animation-delay: calc(var(--i, 0) * 45ms); }
@keyframes enter { from { opacity: 0; transform: translateY(6px) scale(.93); filter: blur(2px); } }

@media (prefers-reduced-motion: reduce) {
  .enter { animation: none; }
  .project, .links a, #terrain { transition: none; }
  .project:active, .links a:active { transform: none; }
}
</style>
</head>
<body>
<canvas id="terrain" aria-hidden="true"></canvas>
<div class="page">
  <header class="hero enter" style="--i:0">
    <h1>Wallace McCarthy</h1>
  </header>
  <p class="intro enter" style="--i:1">Things I've built and put online. Open source ones are on <a href="https://github.com/WallaceMcCarthy">GitHub</a>.</p>

  <h2 class="enter" style="--i:2" id="count">Projects</h2>
  <ul class="projects" id="projects"></ul>
  <noscript><p>This list needs JavaScript. The projects are also on <a href="https://github.com/WallaceMcCarthy">GitHub</a>.</p></noscript>

  <footer class="enter" id="footer">Built by hand and hosted on GitHub Pages.</footer>
</div>

<script src="projects.js"></script>
<script>
(() => {
  const list = document.getElementById('projects');
  const projects = window.PROJECTS || [];
  const el = (tag, props = {}, kids = []) => { const n = Object.assign(document.createElement(tag), props); n.append(...kids); return n; };
  const count = document.getElementById('count');
  count.textContent = 'Projects ';
  count.append(el('span', { textContent: String(projects.length) }));

  projects.forEach((p, i) => {
    const href = p.site || p.source;
    const icon = p.icon
      ? el('img', { className: 'icon', src: p.icon, alt: '', width: 52, height: 52, loading: 'lazy' })
      : el('div', { className: 'icon', ariaHidden: 'true' }, [p.name.slice(0, 1)]);
    const title = el('h3', {}, [
      href ? el('a', { href, textContent: p.name }) : p.name,
      p.year ? el('span', { className: 'year', textContent: String(p.year) }) : ''
    ]);
    const blurb = el('p', {}, [p.blurb]);
    if (p.tags && p.tags.length) blurb.append(' ', el('span', { className: 'tags', textContent: p.tags.join(', ') }));
    const links = el('div', { className: 'links' });
    if (p.site) links.append(el('a', { className: 'primary', href: p.site, textContent: 'Open' }));
    if (p.source) links.append(el('a', { className: p.site ? '' : 'primary', href: p.source, textContent: 'Source' }));
    const li = el('li', { className: 'project enter' }, [icon, title, blurb, links]);
    li.style.setProperty('--i', 3 + i);
    list.append(li);
  });
  document.getElementById('footer').style.setProperty('--i', 3 + projects.length);
})();

// Interactive WebGPU contour map behind the page. The pointer raises a hill, a click drops a ripple.
// No dependency; the page stays plain white when WebGPU is missing or fails.
(async () => {
  const canvas = document.getElementById('terrain');
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const RIPPLES = 4;
  let running = false, last = 0, lastInput = -1e9;
  const pointer = { x: -9999, y: -9999, tx: -9999, ty: -9999, s: 0, ts: 0 };
  const ripples = Array.from({ length: RIPPLES }, () => ({ x: 0, y: 0, t: -1e9 }));
  let next = 0;
  try {
    if (!navigator.gpu) return;
    const adapter = await navigator.gpu.requestAdapter({ powerPreference: 'low-power' });
    if (!adapter) return;
    const device = await adapter.requestDevice();
    const ctx = canvas.getContext('webgpu');
    const format = navigator.gpu.getPreferredCanvasFormat();
    ctx.configure({ device, format, alphaMode: 'opaque' });

    const code = `
      struct U {
        t: f32, w: f32, h: f32, dpr: f32,
        mouse: vec2f, ms: f32, col: f32,
        rip: array<vec4f, ${RIPPLES}>,
      };
      @group(0) @binding(0) var<uniform> u: U;
      @vertex fn vs(@builtin(vertex_index) i: u32) -> @builtin(position) vec4f {
        var p = array(vec2f(-1.0, -3.0), vec2f(-1.0, 1.0), vec2f(3.0, 1.0));
        return vec4f(p[i], 0.0, 1.0);
      }
      fn hash(p: vec2f) -> f32 { return fract(sin(dot(p, vec2f(127.1, 311.7))) * 43758.5453); }
      fn noise(p: vec2f) -> f32 {
        let i = floor(p); let f = fract(p); let s = f * f * (3.0 - 2.0 * f);
        return mix(mix(hash(i), hash(i + vec2f(1.0, 0.0)), s.x),
                   mix(hash(i + vec2f(0.0, 1.0)), hash(i + vec2f(1.0, 1.0)), s.x), s.y);
      }
      fn fbm(p0: vec2f) -> f32 {
        var p = p0; var a = 0.5; var s = 0.0;
        for (var k = 0; k < 5; k++) { s += a * noise(p); p = p * 2.03 + vec2f(1.7, 9.2); a *= 0.5; }
        return s;
      }
      @fragment fn fs(@builtin(position) pos: vec4f) -> @location(0) vec4f {
        let px = pos.xy / u.dpr;                     // CSS pixels
        let uv = px / 420.0;
        var h = fbm(uv * 1.1 + vec2f(u.t * 0.018, -u.t * 0.011)) * 24.0;
        // the pointer is a hill the contours wrap around
        let dm = length(px - u.mouse);
        let hill = exp(-(dm * dm) / (2.0 * 150.0 * 150.0)) * u.ms;
        h += hill * 5.5;
        // clicks send rings outward
        for (var k = 0; k < ${RIPPLES}; k++) {
          let r = u.rip[k];
          let age = u.t - r.z;
          if (age >= 0.0 && age < 3.0) {
            let d = length(px - r.xy);
            let front = d - age * 260.0;
            h += 1.6 * exp(-(front * front) / (2.0 * 28.0 * 28.0)) * exp(-age * 1.4);
          }
        }
        let d = abs(fract(h + 0.5) - 0.5);
        let line = 1.0 - smoothstep(0.0, fwidth(h) * 1.1, d);
        let idx = floor(h + 0.5);
        let major = step(abs(idx / 5.0 - round(idx / 5.0)), 0.01);
        let minor = vec3f(0.88, 0.88, 0.9);
        let accent = vec3f(0.137, 0.251, 0.851);
        let ink = mix(mix(minor, mix(minor, accent, 0.45), major), accent, clamp(hill * 0.75, 0.0, 0.75));
        // keep the text column calm: lines fade toward the centre
        let c = abs(px.x - u.w * 0.5) / max(u.col, 1.0);
        let calm = mix(0.28, 1.0, smoothstep(0.75, 1.15, c));
        let strength = max(calm, hill * 0.9);
        return vec4f(mix(vec3f(1.0), ink, line * strength), 1.0);
      }`;
    const module = device.createShaderModule({ code });
    const pipeline = device.createRenderPipeline({
      layout: 'auto',
      vertex: { module, entryPoint: 'vs' },
      fragment: { module, entryPoint: 'fs', targets: [{ format }] },
    });
    const FLOATS = 8 + RIPPLES * 4;
    const data = new Float32Array(FLOATS);
    const ubuf = device.createBuffer({ size: FLOATS * 4, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
    const bind = device.createBindGroup({ layout: pipeline.getBindGroupLayout(0), entries: [{ binding: 0, resource: { buffer: ubuf } }] });

    let dpr = 1;
    const size = () => {
      dpr = Math.min(devicePixelRatio || 1, 1.5);   // full-screen shader: cap the pixel count
      canvas.width = Math.round(innerWidth * dpr);
      canvas.height = Math.round(innerHeight * dpr);
    };
    size();

    const start = performance.now();
    const now = () => (performance.now() - start) / 1000 + 12;
    function draw() {
      const t = still ? 12 : now();
      pointer.x += (pointer.tx - pointer.x) * 0.18;
      pointer.y += (pointer.ty - pointer.y) * 0.18;
      pointer.s += (pointer.ts - pointer.s) * 0.08;
      data[0] = t; data[1] = innerWidth; data[2] = innerHeight; data[3] = dpr;
      data[4] = pointer.x; data[5] = pointer.y; data[6] = still ? 0 : pointer.s; data[7] = 360;
      ripples.forEach((r, k) => { data[8 + k * 4] = r.x; data[9 + k * 4] = r.y; data[10 + k * 4] = r.t; });
      device.queue.writeBuffer(ubuf, 0, data);
      const enc = device.createCommandEncoder();
      const pass = enc.beginRenderPass({ colorAttachments: [{ view: ctx.getCurrentTexture().createView(), loadOp: 'clear', storeOp: 'store', clearValue: { r: 1, g: 1, b: 1, a: 1 } }] });
      pass.setPipeline(pipeline); pass.setBindGroup(0, bind); pass.draw(3); pass.end();
      device.queue.submit([enc.finish()]);
    }

    draw();
    canvas.classList.add('on');
    addEventListener('resize', () => { size(); if (still || !running) draw(); });
    if (still) return;

    // ~30 fps when idle, 60 fps for two seconds after any pointer input; paused while the tab is hidden
    const loop = ts => {
      if (document.hidden) { running = false; return; }
      running = true;
      const active = ts - lastInput < 2000;
      if (ts - last >= (active ? 15 : 33)) { last = ts; draw(); }
      requestAnimationFrame(loop);
    };
    const kick = () => { if (!running && !document.hidden) requestAnimationFrame(loop); };
    addEventListener('pointermove', e => {
      pointer.tx = e.clientX; pointer.ty = e.clientY; pointer.ts = 1;
      if (pointer.x < -1000) { pointer.x = e.clientX; pointer.y = e.clientY; }
      lastInput = performance.now();
    }, { passive: true });
    document.documentElement.addEventListener('mouseleave', () => { pointer.ts = 0; });
    addEventListener('blur', () => { pointer.ts = 0; });
    addEventListener('pointerdown', e => {
      ripples[next] = { x: e.clientX, y: e.clientY, t: now() };
      next = (next + 1) % RIPPLES;
      lastInput = performance.now();
    }, { passive: true });
    document.addEventListener('visibilitychange', kick);
    kick();
  } catch (err) {
    canvas.classList.remove('on');
  }
})();
</script>
</body>
</html>
